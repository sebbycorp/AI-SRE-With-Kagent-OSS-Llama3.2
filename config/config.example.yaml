# AI-SRE Agent Configuration

# Llama 3.2 LLM Configuration
llama:
  model: llama3.2
  temperature: 0.7
  context_window: 4096
  base_url: http://localhost:11434

# System Monitoring Configuration
monitoring:
  interval: 60  # seconds
  metrics:
    - cpu
    - memory
    - disk
    - network

# Log Analysis Configuration
log_analysis:
  paths:
    - /var/log/syslog
    - /var/log/application.log
  patterns:
    - error
    - warning
    - critical
    - exception
    - failed

# Incident Detection Configuration
incident_detection:
  thresholds:
    cpu_usage: 90      # percent
    memory_usage: 85   # percent
    disk_usage: 90     # percent
    error_rate: 10     # errors per minute

# Remediation Configuration
remediation:
  auto_remediate: false
  require_approval: true
  max_retries: 3
  
  # Safe commands that can be auto-executed
  safe_commands:
    - systemctl restart
    - systemctl stop
    - systemctl start
    - docker restart
    - kubectl rollout restart
